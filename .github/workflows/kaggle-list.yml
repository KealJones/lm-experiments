name: kaggle-list
# Writes kaggle/MINE.md (the account's recent notebooks and their status). Runs on a push to kaggle/list.txt.
on:
  push:
    branches: [main]
    paths: ["kaggle/list.txt", ".github/workflows/kaggle-list.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kaggle-bridge
  cancel-in-progress: false
jobs:
  list:
    runs-on: ubuntu-latest
    environment: KAGGLE
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q kaggle && python kaggle/bridge.py list
      - name: Commit
        run: |
          git config user.name "kaggle-bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaggle/MINE.md
          git diff --cached --quiet && exit 0
          git commit -q -m "kaggle: list notebooks"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
