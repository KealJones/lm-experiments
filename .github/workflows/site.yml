# Builds the lab site from experiments/ and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: site

on:
  push:
    branches: [main]
    paths: ["experiments/**", "site/**", "README.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so each experiment gets its last-commit date
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
