name: hf-run
# Launches queued Hugging Face Jobs (hf/queue/*.json). See hf/README.md.
on:
  push:
    branches: [main]
    paths: ["hf/queue/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hf-bridge
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    environment: HUGGINGFACE
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -U huggingface_hub
      - run: python hf/bridge.py start
      - name: Commit job state
        if: always()
        run: |
          git config user.name "hf-bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hf experiments
          git diff --cached --quiet && exit 0
          git commit -q -m "hf: start queued jobs"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
